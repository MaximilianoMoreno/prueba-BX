<div class="container mx-auto px-4 py-8">
  <div class="mb-8">
    <h1 class="text-3xl font-bold text-center mb-2 text-gray-800">¿Quién tiene? Yo tengo!</h1>
    <p class="text-center text-gray-600">Vista rápida - Encuentra lo que necesitas en tu red</p>
  </div>

  <!-- Selector de grupo -->
  <div class="mb-6 max-w-md mx-auto">
    <label for="grupoSelect" class="block text-sm font-medium text-gray-700 mb-2">
      Filtrar por grupo:
    </label>
    <select 
      id="grupoSelect" 
      [(ngModel)]="selectedGroupId" 
      (change)="filterItemsByGroup(selectedGroupId!)"
      class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white shadow-sm"
    >
      <option value="">Todos los grupos</option>
      <option *ngFor="let grupo of grupos" [value]="grupo._id">{{ grupo.nombre }}</option>
    </select>
  </div>

  <!-- Indicador de carga -->
  <div *ngIf="loading" class="flex justify-center my-12">
    <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-blue-500"></div>
  </div>

  <!-- Mensaje de error -->
  <div *ngIf="error && !loading" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg mb-6 max-w-md mx-auto">
    {{ error }}
  </div>

  <!-- Grid de items -->
  <div *ngIf="!loading" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
    <div 
      *ngFor="let item of filteredItems; trackBy: trackById" 
      class="bg-white rounded-xl shadow-md overflow-hidden border border-gray-100 hover:shadow-lg transition-all duration-300 transform hover:-translate-y-1"
    >
      <div class="p-5">
        <!-- Badge de categoría -->
        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800 mb-3">
          {{ item.categoria }}
        </span>
        
        <h3 class="text-lg font-semibold text-gray-900 mb-2">{{ item.nombre }}</h3>
        
        <p *ngIf="item.descripcion" class="text-gray-600 text-sm mb-4 line-clamp-2">
          {{ item.descripcion }}
        </p>
        
        <!-- Estado y stock -->
        <div class="flex justify-between items-center mb-4">
          <span 
            class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium"
            [ngClass]="{
              'bg-green-100 text-green-800': item.estado === 'Disponible',
              'bg-yellow-100 text-yellow-800': item.estado === 'Pendiente de Aprobación',
              'bg-red-100 text-red-800': item.estado === 'Agotado' || item.estado === 'En Uso'
            }"
          >
            {{ item.estado }}
          </span>
          
          <span *ngIf="item.esInsumo && item.stock !== undefined" class="text-xs text-gray-500">
            Stock: {{ item.stock }}
          </span>
        </div>
        
        <!-- Botón Pedir -->
        <button 
          (click)="onRequestItem(item)"
          [disabled]="item.estado !== 'Disponible' && !(item.esInsumo && item.stock !== undefined && item.stock > 0)"
          class="w-full bg-green-600 hover:bg-green-700 disabled:bg-gray-300 disabled:cursor-not-allowed text-white font-medium py-2.5 px-4 rounded-lg transition-colors duration-300 flex items-center justify-center gap-2"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
            <path d="M2 3a1 1 0 011-1h2.153a1 1 0 01.986.836l.74 4.435a1 1 0 01-.54 1.06l-1.548.773a11.037 11.037 0 006.105 6.105l.774-1.548a1 1 0 011.059-.54l4.435.74a1 1 0 01.836.986V17a1 1 0 01-1 1h-2C7.82 18 2 12.18 2 5V3z"/>
          </svg>
          Pedir
        </button>
      </div>
    </div>
  </div>

  <!-- Mensaje cuando no hay items disponibles -->
  <div *ngIf="!loading && filteredItems.length === 0" class="text-center py-16">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mx-auto text-gray-400 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/>
    </svg>
    <p class="text-gray-500 text-lg">No hay ítems disponibles en este momento.</p>
    <p class="text-gray-400 text-sm mt-2">Prueba seleccionando otro grupo o vuelve más tarde.</p>
  </div>
</div>
